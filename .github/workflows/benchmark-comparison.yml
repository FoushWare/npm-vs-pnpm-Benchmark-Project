# ============================================================================
# Benchmark Comparison Workflow
# ============================================================================
# This workflow runs both npm and pnpm benchmarks and generates a comparison
# report. It uses the same fair comparison rules as the individual workflows.
# ============================================================================

name: Benchmark Comparison

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  npm-benchmark:
    uses: ./.github/workflows/benchmark-npm.yml
    secrets: inherit
  
  pnpm-benchmark:
    uses: ./.github/workflows/benchmark-pnpm.yml
    secrets: inherit
  
  compare:
    needs: [npm-benchmark, pnpm-benchmark]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'
    
    - name: Install benchmark dependencies
      run: npm install
    
    - name: Install pnpm
      run: npm install -g pnpm
    
    - name: Download npm results
      uses: actions/download-artifact@v4
      with:
        path: results/manual
    
    - name: Merge all results to manual directory
      run: |
        mkdir -p results/manual
        find results -name "*.json" -exec cp {} results/manual/ \; 2>/dev/null || true
    
    - name: Generate comparison charts
      run: npm run charts:browser
    
    - name: Upload comparison
      uses: actions/upload-artifact@v4
      with:
        name: comparison-charts
        path: results/charts/
