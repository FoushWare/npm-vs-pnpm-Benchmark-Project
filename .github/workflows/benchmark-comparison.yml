# ============================================================================
# Benchmark Comparison Workflow
# ============================================================================
# This workflow runs both npm and pnpm benchmarks using real-world CI practices
# and generates a comparison report. Tests both cold and warm scenarios with
# proper error handling and deterministic installs.
# ============================================================================

name: Benchmark Comparison

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  npm-benchmark:
    uses: ./.github/workflows/benchmark-npm.yml
    secrets: inherit

  pnpm-benchmark:
    uses: ./.github/workflows/benchmark-pnpm.yml
    secrets: inherit

  compare:
    needs: [npm-benchmark, pnpm-benchmark]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'

    - name: Install benchmark dependencies
      run: npm ci

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Download all results
      uses: actions/download-artifact@v4
      with:
        path: results/ci

    - name: Merge all results to ci directory
      run: |
        mkdir -p results/ci
        find results -name "*.json" -exec cp {} results/ci/ \; 2>/dev/null || true

    - name: Generate comparison charts
      run: npm run charts:browser -- --results-dir results/ci

    - name: Upload comparison
      uses: actions/upload-artifact@v4
      with:
        name: comparison-charts
        path: results/charts/

    - name: Display final comparison summary
      run: node scripts/generate-ci-summary.js results/ci
