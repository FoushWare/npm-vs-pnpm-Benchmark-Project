# ============================================================================
# npm vs pnpm CI Benchmark Comparison
# ============================================================================
# This workflow runs both npm and pnpm benchmarks under fair conditions
# and displays a structured comparison of their performance.
# ============================================================================

name: npm vs pnpm CI Comparison

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [small-app, medium-app, react-app, next-app, node-api, monorepo, legacy-app]
        scenario: [cold, warm, no-deps-changed]
        package_manager: [npm, pnpm]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Fair comparison: Both package managers use the same Node.js version
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'
    
    # Setup pnpm only when needed
    - name: Setup pnpm
      if: matrix.package_manager == 'pnpm'
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    # Fair comparison: pnpm caching
    - name: Get pnpm store directory
      if: matrix.package_manager == 'pnpm'
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    
    - name: Setup pnpm cache
      if: matrix.package_manager == 'pnpm'
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    
    # Fair comparison: npm caching
    - name: Setup npm cache
      if: matrix.package_manager == 'npm'
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'
        cache: 'npm'
    
    - name: Install benchmark dependencies
      run: npm install
    
    - name: Collect environment
      run: npm run benchmark:environment
    
    # Fair comparison: Start from clean state for both package managers
    - name: Clean project
      run: |
        cd projects/${{ matrix.project }}
        rm -rf node_modules package-lock.json pnpm-lock.yaml
    
    # Fair comparison: Cold scenario tests fresh installation with no cache
    - name: Cold CI scenario
      if: matrix.scenario == 'cold'
      id: cold
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        if [ "${{ matrix.package_manager }}" = "npm" ]; then
          npm ci
        else
          pnpm install --frozen-lockfile
        fi
        npm run build
        npm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "📊 ${{ matrix.package_manager }} / ${{ matrix.project }} / ${{ matrix.scenario }}: ${DURATION}ms" >> $GITHUB_STEP_SUMMARY
    
    # Fair comparison: Warm scenario tests installation with cache present
    - name: Warm CI scenario
      if: matrix.scenario == 'warm'
      id: warm
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        if [ "${{ matrix.package_manager }}" = "npm" ]; then
          npm install
        else
          pnpm install
        fi
        npm run build
        npm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "📊 ${{ matrix.package_manager }} / ${{ matrix.project }} / ${{ matrix.scenario }}: ${DURATION}ms" >> $GITHUB_STEP_SUMMARY
    
    # Fair comparison: No-deps scenario skips installation (cache hit)
    - name: No dependency changes scenario
      if: matrix.scenario == 'no-deps-changed'
      id: no-deps
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        npm run build
        npm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "📊 ${{ matrix.package_manager }} / ${{ matrix.project }} / ${{ matrix.scenario }}: ${DURATION}ms" >> $GITHUB_STEP_SUMMARY
    
    - name: Save individual result
      run: |
        mkdir -p results/ci
        duration="${{ steps.cold.outputs.duration || steps.warm.outputs.duration || steps.no-deps.outputs.duration }}"
        echo "{\"package_manager\":\"${{ matrix.package_manager }}\",\"project\":\"${{ matrix.project }}\",\"scenario\":\"${{ matrix.scenario }}\",\"duration_ms\":${duration}}" > results/ci/${{ matrix.package_manager }}-${{ matrix.project }}-${{ matrix.scenario }}.json
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: ci-results-${{ matrix.package_manager }}-${{ matrix.project }}-${{ matrix.scenario }}
        path: results/ci/

  # Summary job that runs after all benchmarks complete
  summary:
    needs: benchmark
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all results
      uses: actions/download-artifact@v4
      with:
        path: results/ci/
    
    - name: Flatten results directory
      run: |
        find results/ci -name "*.json" -exec cp {} results/ci/ \;
        find results/ci -type d -empty -delete
    
    - name: Install dependencies
      run: npm install
    
    - name: Generate comparison summary
      run: node scripts/generate-ci-summary.js results/ci
    
    - name: Display summary in GitHub Actions
      run: |
        cat results/ci/comparison-summary.txt >> $GITHUB_STEP_SUMMARY
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let summary = '';
          
          try {
            summary = fs.readFileSync('results/ci/comparison-summary.txt', 'utf8');
          } catch (e) {
            summary = 'CI benchmark comparison completed. Check the workflow summary for details.';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
