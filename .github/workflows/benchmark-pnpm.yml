# ============================================================================
# pnpm Benchmark Workflow
# ============================================================================
# This workflow benchmarks pnpm performance using real-world CI practices.
# Uses pnpm install --frozen-lockfile for deterministic production installs.
# Tests both cold and warm scenarios with proper error handling (fail-fast).
# ============================================================================

name: pnpm Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [small-app, medium-app, react-app, next-app, node-api, legacy-app, monorepo]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Real CI: Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    # Real CI: pnpm's native caching strategy with proper key based on lockfile
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install benchmark dependencies
      run: npm install

    - name: Install pnpm (for benchmark scripts)
      run: npm install -g pnpm

    # Real CI: Clean all caches and node_modules for cold test
    - name: Clean everything
      run: |
        npm cache clean --force
        pnpm store prune
        rm -rf projects/*/node_modules projects/*/.pnpm

    # Real CI: Cold scenario tests fresh installation with no cache
    - name: Cold CI scenario
      run: npm run ci:benchmark:pnpm ${{ matrix.project }} cold 1

    # Real CI: Warm scenario tests installation with cache (same job)
    - name: Warm CI scenario
      run: npm run ci:benchmark:pnpm ${{ matrix.project }} warm 1

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: pnpm-results-${{ matrix.project }}
        path: results/ci/