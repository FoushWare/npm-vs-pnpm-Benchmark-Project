name: pnpm Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [small-app, medium-app, large-app, frontend-react, frontend-next, node-api, monorepo]
        scenario: [cold, warm, no-deps-changed]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    
    - name: Install benchmark dependencies
      run: pnpm install
    
    - name: Collect environment
      run: pnpm run benchmark:environment
    
    - name: Clean project
      run: |
        cd projects/${{ matrix.project }}
        rm -rf node_modules pnpm-lock.yaml
    
    - name: Cold CI scenario
      if: matrix.scenario == 'cold'
      id: cold
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        pnpm install --frozen-lockfile
        pnpm run build
        pnpm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
    
    - name: Warm CI scenario
      if: matrix.scenario == 'warm'
      id: warm
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        pnpm install
        pnpm run build
        pnpm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
    
    - name: No dependency changes scenario
      if: matrix.scenario == 'no-deps-changed'
      id: no-deps
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        pnpm run build
        pnpm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
    
    - name: Monorepo scenario
      if: matrix.project == 'monorepo'
      id: monorepo
      run: |
        START_TIME=$(date +%s%N)
        cd projects/monorepo
        pnpm install
        pnpm run build
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: pnpm-results-${{ matrix.project }}-${{ matrix.scenario }}
        path: results/