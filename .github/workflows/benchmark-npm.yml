# ============================================================================
# npm Benchmark Workflow
# ============================================================================
# This workflow benchmarks npm performance under fair conditions for comparison
# with pnpm. Both workflows follow strict equivalence rules:
# - Same runner type (ubuntu-latest)
# - Same Node.js version (22.21.1)
# - Equivalent cache strategies (npm cache vs pnpm store)
# - Identical test scenarios (cold, warm, no-deps-changed)
# ============================================================================

name: npm Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [small-app, medium-app, react-app, next-app, node-api, legacy-app]
        scenario: [cold, warm]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Fair comparison: Both workflows use the same Node.js version
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'
        cache: 'npm'  # npm's native caching strategy
    
    - name: Install benchmark dependencies
      run: npm install
    
    - name: Collect environment
      run: npm run benchmark:environment
    
    # Fair comparison: Start from clean state for both package managers
    - name: Clean project
      run: |
        cd projects/${{ matrix.project }}
        rm -rf node_modules package-lock.json
    
    # Fair comparison: Cold scenario tests fresh installation with no cache
    - name: Cold CI scenario
      if: matrix.scenario == 'cold'
      id: cold
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        rm -rf node_modules
        npm ci
        npm run build
        npm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT

    # Fair comparison: Warm scenario tests installation with cache present
    - name: Warm CI scenario
      if: matrix.scenario == 'warm'
      id: warm
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        rm -rf node_modules
        npm ci
        npm run build
        npm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
    
    # Fair comparison: No-deps scenario skips installation (cache hit)
    - name: No dependency changes scenario
      if: matrix.scenario == 'no-deps-changed'
      id: no-deps
      run: |
        START_TIME=$(date +%s%N)
        cd projects/${{ matrix.project }}
        npm run build
        npm run test -- --run
        END_TIME=$(date +%s%N)
        DURATION=$((($END_TIME - $START_TIME) / 1000000))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: npm-results-${{ matrix.project }}-${{ matrix.scenario }}
        path: results/