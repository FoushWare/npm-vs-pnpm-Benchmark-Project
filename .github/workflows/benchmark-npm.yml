# ============================================================================
# npm Benchmark Workflow
# ============================================================================
# This workflow benchmarks npm performance using real-world CI practices.
# Uses npm ci for deterministic production installs. Tests both cold and warm
# scenarios with proper error handling (fail-fast as real CI does).
# ============================================================================

name: npm Benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [small-app, medium-app, react-app, next-app, node-api, legacy-app]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Real CI: Setup Node.js without cache (we test cold/warm explicitly)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install benchmark dependencies
      run: npm install

    - name: Install pnpm (for comparison workflow)
      run: npm install -g pnpm

    # Real CI: Clean all caches and node_modules for cold test
    - name: Clean everything
      run: |
        npm cache clean --force
        pnpm store prune || true
        rm -rf projects/*/node_modules projects/*/.pnpm

    # Real CI: Cold scenario tests fresh installation with no cache
    - name: Cold CI scenario
      run: npm run ci:benchmark:npm ${{ matrix.project }} cold 1

    # Real CI: Warm scenario tests installation with cache (same job)
    - name: Warm CI scenario
      run: npm run ci:benchmark:npm ${{ matrix.project }} warm 1

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: npm-results-${{ matrix.project }}
        path: results/ci/

    - name: Display results summary
      run: |
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║           📦 npm Benchmark Results for ${{ matrix.project }}         ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        if [ -f results/ci/npm-${{ matrix.project }}-cold.json ]; then
          echo "❄️  COLD INSTALL:"
          cat results/ci/npm-${{ matrix.project }}-cold.json
        fi
        if [ -f results/ci/npm-${{ matrix.project }}-warm.json ]; then
          echo ""
          echo "🔥 WARM CACHE:"
          cat results/ci/npm-${{ matrix.project }}-warm.json
        fi